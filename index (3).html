<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- ✏️ UBAH: Judul tab browser -->
  <title>Ainun Farikhah</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* 🎨 WARNA — ubah kode warna di sini untuk mengganti tema */
    :root {
      --cream: #ECEAE3;       /* warna latar belakang halaman */
      --warm-white: #F2EFE8;  /* warna latar kartu utama */
      --ink: #1A1714;         /* warna teks utama */
      --muted: #5E5750;       /* warna teks abu-abu/sekunder */
      --accent: #B86A4E;      /* warna aksen (tombol, garis, ikon) */
      --accent-light: #ECD8CF;/* warna latar ikon & hover */
      --border: #CFC8BC;      /* warna garis tepi */
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
    }

    /* TOP STRIPE */
    .top-stripe {
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent) 0%, #E8A98A 100%);
    }

    /* CARD */
    .card {
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 480px;
      width: calc(100% - 2rem);
      margin: 3rem auto 2rem;
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      animation: fadeUp 0.7s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* AVATAR */
    .avatar-wrap {
      display: inline-block;
      position: relative;
      margin-bottom: 1.5rem;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--warm-white);
      outline: 2px solid var(--border);
      display: block;
      background: var(--accent-light);
    }

    .avatar-initials {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--accent-light);
      border: 3px solid var(--warm-white);
      outline: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    .status-dot {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 14px;
      height: 14px;
      background: #5BBF8A;
      border: 2.5px solid var(--warm-white);
      border-radius: 50%;
    }

    /* NAME & BIO */
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.01em;
      margin-bottom: 0.25rem;
    }

    .tagline {
      font-size: 0.875rem;
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .bio {
      font-size: 0.9375rem;
      color: var(--muted);
      line-height: 1.7;
      max-width: 340px;
      margin: 0 auto 1.75rem;
    }

    /* DIVIDER */
    .divider {
      width: 40px;
      height: 1.5px;
      background: var(--accent);
      margin: 0 auto 1.75rem;
      border-radius: 2px;
    }

    /* CONTACT LINKS */
    .contact-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 2rem;
    }

    .contact-list a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 400;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      background: var(--cream);
    }

    .contact-list a:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .contact-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-icon svg {
      width: 16px;
      height: 16px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .contact-label {
      flex: 1;
      text-align: left;
    }

    .contact-label span {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 300;
    }

    .contact-label strong {
      font-weight: 500;
      font-size: 0.875rem;
    }

    .arrow {
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* FOOTER */
    footer {
      font-size: 0.75rem;
      color: var(--border);
      margin-bottom: 2.5rem;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <div class="top-stripe"></div>

  <div class="card">

    <!-- AVATAR / FOTO PROFIL
         =====================
         CARA PAKAI FOTO:
         1. Upload foto kamu ke folder yang sama dengan file index.html di GitHub
         2. Hapus tanda komentar pada baris "img" di bawah
         3. Ganti "foto-kamu.jpg" dengan nama file foto yang kamu upload
         4. Hapus baris "div avatar-initials" jika sudah pakai foto

         CARA PAKAI INISIAL (default):
         Biarkan seperti sekarang, ganti "AF" dengan inisial namamu
    -->
    <div class="avatar-wrap">
      <!-- Aktifkan baris ini jika ingin pakai foto: -->
      <!-- <img class="avatar" src="foto-kamu.jpg" alt="Foto profil Ainun" /> -->

      <!-- Nonaktifkan baris ini jika sudah pakai foto di atas: -->
      <div class="avatar-initials">AF</div><!-- ✏️ UBAH: ganti "AF" dengan inisial namamu -->

      <span class="status-dot" title="Aktif"></span>
    </div>

    <!-- ✏️ UBAH: Nama lengkap kamu -->
    <h1 class="name">Ainun Farikhah</h1>

    <!-- ✏️ UBAH: Tagline/deskripsi singkat (misal: "Mahasiswa Informatika" atau "Desainer & Fotografer") -->
    <p class="tagline">✦ Mahasiswa &amp; Kreator ✦</p>

    <!-- ✏️ UBAH: Bio / perkenalan singkat kamu -->
    <p class="bio">
      Halo! Selamat datang di halaman profil saya. Saya Ainun, senang berbagi hal-hal positif dan berkenalan dengan orang baru.
    </p>

    <div class="divider"></div>

    <!-- KONTAK — ubah setiap link dan teks sesuai milikmu -->
    <ul class="contact-list">

      <!-- ✏️ UBAH EMAIL: ganti "ainun@email.com" dengan email aslimu (ada 2 tempat) -->
      <li>
        <a href="mailto:ainun@email.com">
          <span class="contact-icon">
            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
          </span>
          <span class="contact-label">
            <span>Email</span>
            <strong>ainun@email.com</strong><!-- ✏️ teks yang tampil -->
          </span>
          <span class="arrow">→</span>
        </a>
      </li>

      <!-- ✏️ UBAH INSTAGRAM: ganti username di link href dan teks strong -->
      <li>
        <a href="https://instagram.com/ainunfarikhah" target="_blank" rel="noopener">
          <span class="contact-icon">
            <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="var(--accent)" stroke="none"/></svg>
          </span>
          <span class="contact-label">
            <span>Instagram</span>
            <strong>@ainunfarikhah</strong><!-- ✏️ teks yang tampil -->
          </span>
          <span class="arrow">→</span>
        </a>
      </li>

      <!-- ✏️ UBAH WHATSAPP: ganti "628xxxxxxxxxx" dengan nomormu (format: 628xxx tanpa tanda + atau spasi) -->
      <li>
        <a href="https://wa.me/628xxxxxxxxxx" target="_blank" rel="noopener">
          <span class="contact-icon">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </span>
          <span class="contact-label">
            <span>WhatsApp</span>
            <strong>Chat saya</strong>
          </span>
          <span class="arrow">→</span>
        </a>
      </li>

    </ul>

  </div>

  <!-- ✏️ UBAH: Teks footer di bagian bawah halaman -->
  <footer>© 2026 Ainun Farikhah</footer>

</body>
</html>
